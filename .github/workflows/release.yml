name: Release

# Publishes the plugin as a GitHub release carrying two assets: the plugin zip and the
# updatePlugins.xml that makes the release usable as an IntelliJ plugin repository.
#
# Developers point their IDE at the stable "latest" URL, which GitHub redirects to whichever
# release is newest:
#
#   https://github.com/<owner>/<repo>/releases/latest/download/updatePlugins.xml
#
# That URL is only reachable without credentials on a public repository. See README.

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to release, without the leading v (e.g. 0.2.0)'
        required: true

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # release notes are generated by diffing against earlier tags

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - uses: gradle/actions/wrapper-validation@v6

      # No Gradle cache here, unlike the build workflow. The cache holds the *extracted* IntelliJ
      # Platform as an artifact-transform output, and restoring a partially written entry — which
      # happens when a push and its tag start jobs seconds apart — yields a platform missing
      # `plugins/java`, failing the build with "Could not find bundled plugin com.intellij.java".
      # Releases are rare; paying the download buys a guaranteed-clean extraction.
      - uses: gradle/actions/setup-gradle@v6
        with:
          cache-disabled: true

      # A tag push carries the version in the ref; a manual run carries it as an input.
      - name: Resolve version
        run: |
          VERSION="${{ inputs.version }}"
          if [ -z "$VERSION" ]; then VERSION="${GITHUB_REF_NAME#v}"; fi
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "TAG=v$VERSION" >> "$GITHUB_ENV"
          echo "ARCHIVE=cucumber-fast-$VERSION.zip" >> "$GITHUB_ENV"

      # The download URL has to be baked into updatePlugins.xml, and it points at an asset of the
      # release this run is about to create.
      #
      # Retried once because extracting the IntelliJ Platform is flaky: it intermittently fails with
      # ClosedFileSystemException, surfacing as "Could not find bundled plugin with ID:
      # com.intellij.java" on code that built fine moments earlier. It has failed both with the
      # Gradle cache on and off, so it is a race in the artifact transform rather than a cache
      # problem. A second attempt reuses the extraction the first one left behind and succeeds.
      - name: Build plugin
        run: |
          build() {
            ./gradlew build buildPlugin \
              -PpluginVersion="$VERSION" \
              -PpluginDownloadUrl="${{ github.server_url }}/${{ github.repository }}/releases/download/$TAG/$ARCHIVE"
          }
          build || {
            echo "::warning::Platform extraction failed; retrying once."
            build
          }

      - name: Verify the archive was named as expected
        run: test -f "build/distributions/$ARCHIVE"

      # Retried because the GitHub API itself is not always available — this step has failed with a
      # 503 on a build that was otherwise fine. Creating and uploading are separated so a retry after
      # a half-finished attempt tops up the assets instead of failing on an existing release.
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          publish() {
            if gh release view "$TAG" >/dev/null 2>&1; then
              gh release upload "$TAG" \
                "build/distributions/$ARCHIVE" build/distributions/updatePlugins.xml --clobber
            else
              gh release create "$TAG" \
                "build/distributions/$ARCHIVE" build/distributions/updatePlugins.xml \
                --title "$TAG" --generate-notes
            fi
          }
          for attempt in 1 2 3; do
            if publish; then exit 0; fi
            echo "::warning::Publishing failed (attempt $attempt); retrying."
            sleep $((attempt * 15))
          done
          exit 1
