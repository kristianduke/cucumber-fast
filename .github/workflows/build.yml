name: Build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  # Superseding a pull request push saves runner time; superseding a push to main would leave
  # commits that were never verified.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      # The wrapper jar is a binary in the repository; verify it is a genuine Gradle release.
      - uses: gradle/actions/wrapper-validation@v6

      - uses: gradle/actions/setup-gradle@v6

      # `build` compiles and tests; the distribution zip comes from `buildPlugin`, which `build`
      # does not depend on. Downloading the IntelliJ Platform takes a while on a cold cache;
      # setup-gradle keeps it warm.
      - name: Build and test
        run: ./gradlew build buildPlugin

      - name: Upload plugin archive
        if: success()
        uses: actions/upload-artifact@v7
        with:
          name: cucumber-fast-${{ github.sha }}
          path: build/distributions/*.zip
          if-no-files-found: error

      - name: Upload test report
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: test-report
          path: build/reports/tests/test
