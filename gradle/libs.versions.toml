[versions]
# Toolchain / language
javaVersion = "21"
kotlin = "2.4.10"

# Target IDE: matches the locally installed IntelliJ IDEA 2026.3 (build 263.7307.353).
# IntelliJ IDEA is a single product from 2025.3 on; there is no separate Community (IC) build.
platformType = "IU"
platformVersion = "2026.3"

# Marketplace plugin dependencies
# gherkin -> https://plugins.jetbrains.com/plugin/9164-gherkin
gherkin = "263.7307.101"

# Build tooling
intellijPlatform = "2.20.1"
changelog = "2.5.0"

# Test
junit = "4.13.2"
opentest4j = "1.3.0"

[libraries]
junit = { group = "junit", name = "junit", version.ref = "junit" }
opentest4j = { group = "org.opentest4j", name = "opentest4j", version.ref = "opentest4j" }

[plugins]
kotlin = { id = "org.jetbrains.kotlin.jvm", version.ref = "kotlin" }
intelliJPlatform = { id = "org.jetbrains.intellij.platform", version.ref = "intellijPlatform" }
changelog = { id = "org.jetbrains.changelog", version.ref = "changelog" }
